name: verify
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/secret-patterns.test.mjs
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile lot_ticket.py ticket_sync.py tests/test_ticket_sync.py
      - run: node scripts/verify.mjs
      - run: node scripts/check-locked.mjs
      - run: node scripts/check-tracked-secrets.mjs
