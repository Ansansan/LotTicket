name: verify
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verify.mjs
      - run: node scripts/check-locked.mjs
      - run: node scripts/check-tracked-secrets.mjs
